<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة الشعر</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe3;--card:#fffaf0;--ink:#2b2118;--mut:#7a6a58;--acc:#8a4b1f;--acc2:#fff;--bd:#e2d3bb;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1812;--card:#2a231a;--ink:#f1e6d3;--mut:#b5a58f;--acc:#d9a066;--acc2:#1d1812;--bd:#3e3427;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#1d1812;--card:#2a231a;--ink:#f1e6d3;--mut:#b5a58f;--acc:#d9a066;--acc2:#1d1812;--bd:#3e3427;--bad:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px}
#s{width:100%;max-width:440px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;text-align:center}
h1,h2{font-family:Amiri,serif;margin:0 0 10px}
h1{font-size:2.2rem;color:var(--acc)}
ol{text-align:right;padding-inline-start:22px;line-height:1.9;color:var(--mut);margin:12px 0}
button{display:block;width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--acc2);font-size:1.05rem;font-weight:700;font-family:inherit}
button.alt{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.big{font-family:Amiri,serif;font-size:5rem;color:var(--acc);line-height:1.2}
.tm{font-size:2.4rem;font-weight:700;color:var(--acc)}
.tm.low{color:var(--bad)}
.who{color:var(--mut);font-weight:700}
.last{font-family:Amiri,serif;font-size:1.25rem;line-height:1.8;margin:8px 0;padding:8px;border-radius:10px;background:var(--bg)}
.lt{margin:8px 0;font-size:1.1rem}
.lt b{font-family:Amiri,serif;font-size:2rem;color:var(--acc);vertical-align:middle}
textarea,input{width:100%;font-family:Amiri,serif;font-size:20px;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--ink);resize:none}
.m{min-height:1.4em;color:var(--bad);margin:6px 0 0;font-size:.95rem}
.hint{color:var(--mut);font-size:.85rem;margin:8px 0 0}
body{--bg:rgba(255,255,255,.08);--card:rgba(20,14,40,.55);--bd:rgba(255,255,255,.18);--ink:#f7eddb;--mut:#cdbfa5;--acc:#f0b45a;--acc2:#241638;--bad:#ff8f87;--g1:#1b1438;--glow:#6a3fa0;background:var(--g1);color:var(--ink);transition:background-color 1s}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,var(--glow),transparent 65%);opacity:.55;z-index:0}
body[data-t=war]{--g1:#2a0c0c;--glow:#c0392b;--acc:#ff9a52}
body[data-t=love]{--g1:#2e0f25;--glow:#e0508a;--acc:#ff8fb8}
body[data-t=wisdom]{--g1:#2a2108;--glow:#d9a81e;--acc:#ffd36b}
body[data-t=night]{--g1:#0a1230;--glow:#3a5bd9;--acc:#a9c1ff}
body[data-t=sea]{--g1:#06242c;--glow:#12a3b5;--acc:#7fe3ef}
body[data-t=home]{--g1:#0f2a14;--glow:#3fae5a;--acc:#9be3a6}
#s{position:relative;z-index:2}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.35);border-radius:22px}
h1{font-size:2.6rem;text-shadow:0 0 18px var(--glow)}
.big,.tm{text-shadow:0 0 16px var(--glow)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
#fx span{position:absolute;opacity:0;animation:fl linear infinite}
#fx.up span{bottom:-40px}
#fx.dn span{top:-40px;animation-name:fd}
@keyframes fl{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}
@keyframes fd{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.8}100%{transform:translateY(110vh) rotate(-40deg);opacity:0}}
.tg{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:99px;background:var(--card);color:var(--acc);font-weight:700;z-index:3;animation:tg 2.5s forwards}
@keyframes tg{0%{opacity:0}15%,80%{opacity:1}100%{opacity:0}}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;font-size:1.9rem;background:var(--bg);border:2px solid var(--bd)}
.vs{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:8px}
.vs div{display:flex;flex-direction:column;align-items:center;opacity:.5;transition:.3s}
.vs div.on{opacity:1}.vs div.on .av{border-color:var(--acc);box-shadow:0 0 14px var(--glow)}
.vs small{margin-top:4px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl{display:flex;align-items:center;gap:12px;margin:12px 0}.pf{flex:1}
.up{display:block;margin-top:8px;padding:8px;border:1px dashed var(--bd);border-radius:10px;color:var(--acc)}
#sb{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:44px;height:44px;margin:0;padding:0;border-radius:50%;z-index:3;font-size:1.2rem;background:var(--card);border:1px solid var(--bd)}
</style>
</head>
<body>
<div id="fx"></div><div id="s"></div><button id="sb" onclick="mu()">🔊</button>
<script>
const V=["إذا الشعبُ يومًا أرادَ الحياةَ فلا بدَّ أن يستجيبَ القدرْ","بلادي وإنْ جارتْ عليَّ عزيزةٌ وأهلي وإنْ ضنّوا عليَّ كرامُ","وما نيلُ المطالبِ بالتمنّي ولكنْ تؤخذُ الدنيا غِلابا","على قدرِ أهلِ العزمِ تأتي العزائمُ وتأتي على قدرِ الكرامِ المكارمُ","الخيلُ والليلُ والبيداءُ تعرفُني والسيفُ والرمحُ والقرطاسُ والقلمُ","لكلِّ امرئٍ من دهرِهِ ما تعوّدا وعادةُ سيفِ الدولةِ الطعنُ في العدا","قفا نبكِ من ذكرى حبيبٍ ومنزلِ بسقطِ اللوى بينَ الدخولِ فحومل","كفى بكَ داءً أنْ ترى الموتَ شافيا وحسبُ المنايا أنْ يكنَّ أمانيا","ما كلُّ ما يتمنّى المرءُ يدركُهُ تجري الرياحُ بما لا تشتهي السفنُ","نعيبُ زمانَنا والعيبُ فينا وما لزماننا عيبٌ سوانا","يا ليلُ الصبُّ متى غدُهُ أقيامُ الساعةِ موعدُهُ","تعلّمْ فليسَ المرءُ يولدُ عالِمًا وليسَ أخو علمٍ كمَن هو جاهلُ","ربَّ يومٍ بكيتُ منهُ فلمّا صرتُ في غيرِهِ بكيتُ عليهِ","هذا الذي تعرفُ البطحاءُ وطأتَهُ والبيتُ يعرفُهُ والحلُّ والحرمُ","دعِ الأيامَ تفعلُ ما تشاءُ وطبْ نفسًا إذا حكمَ القضاءُ","لا تحسبنَّ المجدَ تمرًا أنتَ آكلُهُ لن تبلغَ المجدَ حتى تلعقَ الصَّبِرا","جزى اللهُ الشدائدَ كلَّ خيرٍ عرفتُ بها عدوّي من صديقي","شكوتُ إلى وكيعٍ سوءَ حفظي فأرشدني إلى تركِ المعاصي","ذو العقلِ يشقى في النعيمِ بعقلِهِ وأخو الجهالةِ في الشقاوةِ ينعمُ","غيرُ مجدٍ في ملّتي واعتقادي نوحُ باكٍ ولا ترنّمُ شادِ","أنا الذي نظرَ الأعمى إلى أدبي وأسمعتْ كلماتي مَن بهِ صممُ","عيدٌ بأيّةِ حالٍ عدتَ يا عيدُ بما مضى أم لأمرٍ فيكَ تجديدُ","لا تسقِني ماءَ الحياةِ بذلّةٍ بل فاسقِني بالعزِّ كأسَ الحنظلِ","من يهُنْ يسهُلِ الهوانُ عليهِ ما لجرحٍ بميّتٍ إيلامُ","وإذا كانتِ النفوسُ كبارًا تعبتْ في مرادِها الأجسامُ","إذا غامرتَ في شرفٍ مرومٍ فلا تقنعْ بما دونَ النجومِ","يقولونَ ليلى في العراقِ مريضةٌ فيا ليتني كنتُ الطبيبَ المداويا","زعمَ الفرزدقُ أنْ سيقتلُ مربعًا أبشِرْ بطولِ سلامةٍ يا مربعُ","ثلاثةٌ تشرقُ الدنيا ببهجتِها شمسُ الضحى وأبو إسحاقَ والقمرُ","حسدوا الفتى إذ لم ينالوا سعيَهُ فالقومُ أعداءٌ لهُ وخصومُ","خُلِقتُ ألوفًا لو رجعتُ إلى الصبا لفارقتُ شيبي موجعَ القلبِ باكيا","سأضربُ في طولِ البلادِ وعرضِها أنالُ مرادي أو أموتُ غريبا","صفحنا عن بني ذهلٍ وقلنا القومُ إخوانُ عسى الأيامُ أن يرجعنَ قومًا كالذي كانوا","ضحكنا وكان الضحكُ منا سفاهةً وحقٌّ لسكانِ البسيطةِ أن يبكوا","طلبتُ المستقرَّ بكلِّ أرضٍ فلم أرَ لي بأرضٍ مستقرّا","ظلمُ ذوي القربى أشدُّ مضاضةً على المرءِ من وقعِ الحسامِ المهنّدِ","فإنْ تفُقِ الأنامَ وأنتَ منهم فإنَّ المسكَ بعضُ دمِ الغزالِ","من لم يمتْ بالسيفِ ماتَ بغيرِهِ تعدّدتِ الأسبابُ والموتُ واحدُ","ما أكثرَ الإخوانَ حينَ تعدُّهم ولكنّهم في النائباتِ قليلُ","لعمرُكَ ما الإنسانُ إلا ابنُ يومِهِ على ما تجلّى يومُهُ لا ابنُ أمسِهِ","نقِّلْ فؤادَكَ حيثُ شئتَ من الهوى ما الحبُّ إلا للحبيبِ الأوّلِ","يا دارَ مَيّةَ بالعلياءِ فالسّندِ أقوتْ وطالَ عليها سالفُ الأبدِ","دعِ المقاديرَ تجري في أعِنّتِها ولا تبيتنَّ إلا خاليَ البالِ","رُبَّما تجزعُ النفوسُ من الأمرِ لهُ فرجةٌ كحلِّ العقالِ","هلْ غادرَ الشعراءُ من متردَّمِ أمْ هلْ عرفتَ الدارَ بعدَ توهّمِ","عرفتُ الشرَّ لا للشرِّ لكنْ لتوقّيهِ ومن لا يعرِفِ الشرَّ من الناسِ يقعْ فيهِ","ومن يكُ ذا فضلٍ فيبخلْ بفضلِهِ على قومِهِ يُستغنَ عنهُ ويُذممِ","ومن لا يحبُّ صعودَ الجبالِ يعِشْ أبدَ الدهرِ بينَ الحُفَرْ","قد يُدركُ المتأنّي بعضَ حاجتِهِ وقد يكونُ مع المستعجِلِ الزللُ","كلُّ ابنِ أنثى وإن طالتْ سلامتُهُ يومًا على آلةٍ حدباءَ محمولُ","تُعيِّرُنا أنّا قليلٌ عديدُنا فقلتُ لها إنَّ الكرامَ قليلُ","أنا البحرُ في أحشائهِ الدرُّ كامنٌ فهل ساءلوا الغوّاصَ عن صدفاتي","وليلٍ كموجِ البحرِ أرخى سدولَهُ عليَّ بأنواعِ الهمومِ ليبتلي","أمرُّ على الديارِ ديارَ ليلى أقبِّلُ ذا الجدارِ وذا الجدارا","وطني لو شُغلتُ بالخلدِ عنهُ نازعتني إليهِ في الخلدِ نفسي","ولقد ذكرتُكِ والرماحُ نواهلٌ منّي وبيضُ الهندِ تقطرُ من دمي","ألا أيّها الليلُ الطويلُ ألا انجلي بصبحٍ وما الإصباحُ منكَ بأمثلِ"];
const S=document.getElementById('s'),$=id=>document.getElementById(id);
const e=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>s.replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱءؤئ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\u0621-\u064A]/g,'');
let M,T,L,U,last,iv,t;
const nm=p=>M==1?(p==0?e(P[0].n||'أنت'):OPP[D].n):e(P[p].n||'اللاعب '+(p+1));

function start(){
 clearInterval(iv);
 S.innerHTML=`<div class="card"><h1>📜 لعبة الشعر</h1>
 <p>يقول اللاعب بيتًا، ويردّ الخصم ببيت يبدأ بآخر حرف من بيته.</p>
 <ol><li>اكتب بيتًا كاملًا ثم اضغط «تم».</li>
 <li>يظهر للخصم الحرف الأخير، وعليه أن يبدأ به.</li>
 <li>لكل دور وقت محدد حسب المستوى. إذا انتهى وقتك تخسر ويفوز الخصم.</li>
 <li>في وضع اللاعبين: بعد «تم» مرّر الجوال للخصم ليضغط «أنا جاهز».</li></ol>
 <button onclick="lv(1)">🤖 ضد الكمبيوتر</button>
 <button class="alt" onclick="lv(2)">👥 لاعبان على نفس الجوال</button><p class="hint">من تصميم <bdi>sami taki eddine</bdi></p></div>`;
}
function lv(m){S.innerHTML=`<div class="card"><h2>اختر المستوى</h2><button onclick="go(${m},0)">🌱 سهل — 60 ثانية${m==1?'، والكمبيوتر قد يستسلم':''}</button><button onclick="go(${m},1)">🌿 متوسط — 30 ثانية</button><button onclick="go(${m},2)">🔥 صعب — 15 ثانية${m==1?'، والكمبيوتر يلاحقك بحروف صعبة':''}</button><button class="alt" onclick="start()">رجوع</button></div>`}
function go(m,i){M=m;if(i!==undefined)D=i;T=0;L=null;U=new Set();last='';R=[[],[]];fx('');setup();}

function pass(){
 S.innerHTML=`<div class="card">${bkb()}${vs()}<h2>📱 مرّر الجوال إلى ${nm(T)}</h2>
 <p>سيبدأ الوقت (${LV[D].t} ثانية) عندما يضغط ${nm(T)} على «أنا جاهز».</p>
 ${L?`<p class="who">الحرف المطلوب</p><div class="big">${L}</div>`:'<p class="who">ابدأ بأي بيت تحب</p>'}
 <button onclick="play()">أنا جاهز</button></div>`;
}
function play(){
 t=LV[D].t;ts=Date.now();
 S.innerHTML=`<div class="card">${bkb()}${vs()}${M==1?`<div class="hint">الجولة ${R[0].length+1} من 10</div>`:''}<div id="tm" class="tm">${t}</div>
 ${last?`<div class="last">${e(last)}</div>`:''}
 <div class="lt">${L?`ابدأ بحرف <b>${L}</b>`:'ابدأ بأي بيت تحب'}</div>
 <input id="i" placeholder="الشطر الأول (الصدر)"><input id="i2" placeholder="الشطر الثاني (العجز)" style="margin-top:8px">
 <p id="m" class="m"></p><button onclick="send()">تم</button>
 ${M==2?'<p class="hint">بعد «تم» مرّر الجوال للخصم.</p>':''}</div>`;
 clearInterval(iv);
 iv=setInterval(()=>{t--;const x=$('tm');x.textContent=t;if(t<=5){x.className='tm low';snd([t<=2?988:784])}if(t<=0){clearInterval(iv);end(`انتهى وقت ${nm(T)}! ${M==1?'فاز الكمبيوتر 🤖':'فاز '+nm(1-T)+' 🎉<br><small>مرّر الجوال للفائز ليحتفل 😄</small>'}`)}},1000);
}
function send(){
 const a=$('i').value.trim(),b=$('i2').value.trim(),v=a+' … '+b,n=norm(a+b),m=$('m'),la=norm(a).length,lc=norm(b).length;
 if(!a||!b){m.textContent='اكتب الشطرين معًا: الصدر ثم العجز.';return}
 if(a.split(/\s+/).length<2||b.split(/\s+/).length<2||Math.min(la,lc)<8||Math.max(la,lc)>2*Math.min(la,lc)||norm(a)==norm(b)){m.textContent='الشطران غير متقاربين في الطول، تأكد من كتابة البيت كاملاً.';return}
 if(n.length<6){m.textContent='اكتب بيتًا كاملًا.';return}
 if(L&&n[0]!==L){m.textContent=`يجب أن يبدأ البيت بحرف «${L}».`;return}
 if(U.has(n)){m.textContent='هذا البيت قيل من قبل.';return}
 clearInterval(iv);U.add(n);L=n.slice(-1);last=v;rec(T);fx(v);if(M==1&&R[0].length>=10){end('🎉 فزتَ! أنهيتَ عشر جولات وخسر الكمبيوتر');return}
 if(M==1){
  T=1;S.innerHTML='<div class="card">'+vs()+'<h2>🤖 الكمبيوتر يفكّر…</h2></div>';
  setTimeout(()=>{
   const c=V.filter(x=>!U.has(norm(x))&&norm(x)[0]===L);
   if(!c.length||Math.random()<LV[D].g){end(`${c.length?'تظاهر الكمبيوتر بالعجز':'انتهت أبيات الكمبيوتر'} عند حرف «${L}». فزتَ! 🎉`);return}
   const x=(D==2||(D==1&&Math.random()<.5))?c.map(y=>[y,V.filter(z=>!U.has(norm(z))&&norm(z)[0]===norm(y).slice(-1)).length]).sort((a,b)=>a[1]-b[1])[0][0]:c[Math.floor(Math.random()*c.length)];
   U.add(norm(x));L=norm(x).slice(-1);last=x;fx(x);T=0;play();
  },900);
 }else{T=1-T;pass();}
}
function end(msg){
 clearInterval(iv);
 S.innerHTML=`<div class="card"><h2>${msg}</h2><button onclick="go(M)">العب مرة أخرى</button><button class="alt" onclick="start()">القائمة الرئيسية</button></div>`;
}
function gate(){
 S.innerHTML=`<div class="card"><h1>🔒 البوابة</h1><p>للدخول إلى اللعبة أجب عن السؤال:</p><p class="lt">ما هي الرياضة المفضلة لـ <bdi>sami taki eddine</bdi>؟</p><input id="a" placeholder="اكتب الإجابة بنفسك"><p id="m" class="m"></p><button onclick="chk()">دخول</button><p class="hint">لعبة من تصميم <bdi>sami taki eddine</bdi></p></div>`;
}
function chk(){
 if(norm($('a').value)==='كرهالقدم')start();else $('m').textContent='إجابة خاطئة، حاول مرة أخرى.';
